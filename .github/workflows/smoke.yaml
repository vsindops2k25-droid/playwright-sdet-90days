
name: Smoke tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker image
        run: docker build -t playwright-smoke:1.0 .

      - name: Run Playwright smoke tests in Docker
        run: |
          mkdir -p playwright-report test-results
          docker run --rm \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            playwright-smoke:1.0

      - name: Upload Playwright report and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

